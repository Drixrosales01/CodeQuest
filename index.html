<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#060912">
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050711">
<meta name="mobile-web-app-capable" content="yes">
<title>Duolincode: Learn to Code</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
 box-sizing:border-box;
}

:root{
 --bg:#f3faff;
 --bg2:#ffffff;

 --panel:#ffffff;
 --panel2:#f7fbff;

 --line:#cfe5f7;
 --line2:#a9d2ef;

 --text:#23405a;
 --muted:#708aa0;

 /* BLUE */
 --blue:#2388ff;
 --blue2:#086bd8;
 --blue3:#dff1ff;
 --blue4:#bce2ff;

 /* ORANGE */
 --orange:#ff8a21;
 --orange2:#ffb13b;
 --orange3:#fff0dc;

 /* YELLOW */
 --yellow:#ffd329;
 --yellow2:#fff5b8;
 --yellow3:#fffbe5;

 /* GREEN */
 --green:#51c94b;
 --green2:#8be76c;
 --green3:#e7f9e3;

 /* CYAN */
 --cyan:#20c9e8;
 --cyan2:#8cefff;
 --cyan3:#e3fbff;

 /* PURPLE */
 --purple:#8b6cff;
 --purple2:#b49cff;
 --purple3:#eeeaff;

 /* PINK */
 --pink:#ff659e;
 --pink2:#ff9fc1;
 --pink3:#ffe8f1;

 /* RED */
 --red:#ef5350;
 --red2:#ff8585;
 --red3:#fff0f0;

 --gold:#ffc928;

 --python:#3aa7ff;
 --python2:#dff3ff;

 --shadow:0 8px 0 #c8ddec;
 --shadow-small:0 5px 0 #c8ddec;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 min-height:100vh;

 background:
 radial-gradient(circle at 5% 10%,#ffffff 0,transparent 22%),
 radial-gradient(circle at 95% 10%,#dff2ff 0,transparent 25%),
 radial-gradient(circle at 10% 90%,#eee8ff 0,transparent 25%),
 radial-gradient(circle at 90% 90%,#fff0d9 0,transparent 25%),
 #eef8ff;

 color:var(--text);

 font-family:
 Inter,
 system-ui,
 -apple-system,
 BlinkMacSystemFont,
 "Segoe UI",
 Arial,
 sans-serif;

 font-weight:600;
}

button,
input,
textarea{
 font:inherit;
 color:inherit;
}

button{
 border:0;
 cursor:pointer;
}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

/* =========================================================
   APP
========================================================= */

.app-shell{
 width:100%;
 max-width:560px;
 min-height:100vh;
 margin:auto;

 background:
 radial-gradient(circle at 15% 15%,#ffffffcc 0,transparent 25%),
 radial-gradient(circle at 90% 30%,#e5f5ff99 0,transparent 28%),
 radial-gradient(circle at 10% 85%,#f1eaff88 0,transparent 28%),
 radial-gradient(circle at 90% 90%,#fff1df88 0,transparent 25%),
 #f6fbff;

 position:relative;
 overflow:hidden;

 padding-bottom:100px;

 border-left:1px solid #d5e8f7;
 border-right:1px solid #d5e8f7;
}

/* colorful game dots */

.app-shell:before{
 content:"";
 position:absolute;
 inset:0;

 background-image:
 radial-gradient(#2388ff20 1px,transparent 1px),
 radial-gradient(#ff8a2118 1px,transparent 1px);

 background-size:22px 22px,34px 34px;

 background-position:0 0,12px 15px;

 pointer-events:none;
}

/* =========================================================
   LOGIN
========================================================= */

#authScreen{
 position:fixed;
 inset:0;
 z-index:1000;

 display:grid;
 place-items:center;

 padding:20px;

 background:
 radial-gradient(circle at 15% 15%,#ffffff 0,transparent 25%),
 radial-gradient(circle at 85% 20%,#dff3ff 0,transparent 30%),
 radial-gradient(circle at 20% 90%,#eee7ff 0,transparent 28%),
 radial-gradient(circle at 90% 85%,#fff0d9 0,transparent 30%),
 linear-gradient(135deg,#eaf7ff,#fff9ef);
}

.auth-box{
 width:min(430px,100%);

 padding:30px;

 background:#ffffff;

 border:3px solid var(--blue);

 border-radius:30px;

 box-shadow:
 0 12px 0 #b9d8ef,
 0 25px 50px #5b87aa33;

 animation:pop .5s ease;
}

.logo{
 text-align:center;
 margin-bottom:24px;
}

.logo-mark{
 width:82px;
 height:82px;

 margin:auto;

 display:grid;
 place-items:center;

 border-radius:25px;

 background:
 linear-gradient(
 145deg,
 var(--orange),
 var(--yellow)
 );

 color:white;

 font-size:30px;

 border:4px solid white;

 box-shadow:
 0 7px 0 #d86b14,
 0 15px 30px #ff8a2144;

 transform:rotate(-4deg);
}

.logo h1{
 margin:16px 0 4px;

 font-size:32px;
 font-weight:1000;

 color:var(--blue2);

 letter-spacing:-1px;
}

.logo p{
 margin:0;

 color:var(--muted);

 font-size:13px;
}

/* =========================================================
   AUTH TABS
========================================================= */

.auth-tabs{
 display:flex;

 gap:6px;

 padding:5px;

 background:
 linear-gradient(
 90deg,
 #eaf5ff,
 #f4efff,
 #fff3e4
 );

 border:2px solid var(--line);

 border-radius:15px;

 margin-bottom:18px;
}

.auth-tabs button{
 flex:1;

 padding:12px;

 background:transparent;

 color:var(--muted);

 border-radius:10px;

 font-weight:1000;
}

.auth-tabs button.active{
 background:white;

 color:var(--blue2);

 box-shadow:
 0 4px 0 #c7ddec;
}

/* =========================================================
   INPUT
========================================================= */

.input-group{
 margin-bottom:14px;
}

.input-group label{
 display:block;

 font-size:9px;

 text-transform:uppercase;

 letter-spacing:1.5px;

 color:var(--blue2);

 font-weight:1000;

 margin-bottom:6px;
}

.input{
 width:100%;

 padding:14px;

 background:#f8fcff;

 border:2px solid #c9dfef;

 border-radius:13px;

 outline:none;

 transition:.15s;
}

.input:focus{
 background:white;

 border-color:var(--blue);

 box-shadow:
 0 0 0 4px #2388ff18;
}

.auth-error{
 min-height:18px;

 color:var(--red);

 font-size:12px;

 margin:4px 0;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
 height:70px;

 display:flex;

 align-items:center;

 justify-content:space-between;

 padding:0 13px;

 border-bottom:2px solid #d3e6f5;

 background:#ffffffee;

 backdrop-filter:blur(15px);

 position:sticky;

 top:0;

 z-index:20;

 box-shadow:0 4px 15px #427aa014;
}

.icon-btn{
 width:42px;
 height:42px;

 border-radius:13px;

 background:#eaf5ff;

 border:2px solid #c6e0f4;

 color:var(--blue2);

 font-size:17px;

 box-shadow:0 4px 0 #c5dbea;

 transition:.15s;
}

.icon-btn:hover{
 background:#dff1ff;

 border-color:var(--blue);

 transform:translateY(-2px);
}

.icon-btn:active{
 transform:translateY(2px);

 box-shadow:0 1px 0 #c5dbea;
}

.brand{
 display:flex;

 align-items:center;

 gap:8px;

 font-weight:1000;

 color:var(--blue2);
}

.brand-mark{
 color:var(--orange);

 font-family:monospace;

 font-size:18px;
}

.header-right{
 display:flex;

 align-items:center;

 gap:5px;
}

.resource{
 background:#fff7e9;

 border:2px solid #ffd9a5;

 border-radius:11px;

 padding:7px 8px;

 font-size:10px;

 box-shadow:0 3px 0 #e8c48f;
}

.resource:first-child{
 color:#e18a00;
}

.resource:nth-child(2){
 color:#ef6f1e;
}

.avatar{
 width:36px;
 height:36px;

 border-radius:50%;

 display:grid;

 place-items:center;

 background:
 linear-gradient(
 145deg,
 var(--blue),
 var(--cyan)
 );

 color:white;

 font-weight:1000;

 border:3px solid white;

 box-shadow:
 0 4px 0 #1765b5;
}

/* =========================================================
   MAIN
========================================================= */

#main{
 padding:18px 14px 30px;

 position:relative;

 z-index:1;
}

.hero{
 padding:8px 3px 20px;

 animation:rise .35s ease;
}

.eyebrow{
 font-size:9px;

 color:var(--orange);

 font-weight:1000;

 letter-spacing:2px;

 text-transform:uppercase;
}

.hero h1{
 font-size:30px;

 line-height:1.04;

 margin:8px 0;

 color:var(--blue2);

 font-weight:1000;

 letter-spacing:-.7px;
}

.hero p{
 color:var(--muted);

 font-size:13px;

 line-height:1.55;

 margin:0;
}

/* =========================================================
   GENERAL CARDS
========================================================= */

.card{
 background:white;

 border:2px solid #d0e3f1;

 border-radius:21px;

 padding:15px;

 box-shadow:
 var(--shadow-small),
 0 12px 25px #5080a41c;

 animation:rise .35s ease both;
}

.card h2,
.card h3{
 margin:0 0 7px;

 color:var(--text);
}

.muted{
 color:var(--muted);

 font-size:12px;

 line-height:1.5;
}

.section{
 display:flex;

 justify-content:space-between;

 align-items:center;

 margin:25px 0 11px;
}

.section h2{
 margin:0;

 font-size:17px;

 color:var(--blue2);

 font-weight:1000;
}

.section button{
 background:none;

 color:var(--orange);

 font-size:10px;

 font-weight:1000;
}

/* =========================================================
   PLAYER CARD
========================================================= */

.player-card{
 position:relative;

 overflow:hidden;

 padding:18px;

 border-radius:23px;

 background:
 radial-gradient(circle at 95% 0,#ff9a3044,transparent 35%),
 radial-gradient(circle at 0% 100%,#2388ff28,transparent 40%),
 radial-gradient(circle at 50% 50%,#8b6cff0c,transparent 45%),
 white;

 border:3px solid var(--blue);

 box-shadow:
 0 8px 0 #b9d7ed,
 0 15px 35px #427ba329;
}

.player-top{
 display:flex;

 align-items:center;

 gap:13px;
}

.player-avatar{
 width:61px;
 height:61px;

 border-radius:19px;

 display:grid;

 place-items:center;

 font-size:25px;

 background:
 linear-gradient(
 145deg,
 #e7f5ff,
 #fff4df
 );

 border:3px solid var(--orange);

 color:var(--orange);

 box-shadow:
 0 5px 0 #d86e18;
}

.player-info{
 flex:1;
}

.player-info small{
 color:var(--muted);

 font-size:9px;

 font-weight:800;
}

.player-info b{
 display:block;

 margin-top:3px;

 font-size:17px;

 color:var(--blue2);
}

.rank{
 color:#e08b00;

 font-size:10px;

 font-weight:1000;
}

.xp-row{
 display:flex;

 justify-content:space-between;

 align-items:center;

 margin-top:14px;

 font-size:10px;

 font-weight:1000;
}

.xp-bar{
 height:13px;

 margin:7px 0 4px;

 background:#e7f0f7;

 border:2px solid #c9ddea;

 border-radius:99px;

 overflow:hidden;
}

.xp-fill{
 height:100%;

 background:
 linear-gradient(
 90deg,
 var(--orange),
 var(--yellow),
 var(--green)
 );

 border-radius:99px;

 box-shadow:
 inset 0 2px #ffffff77;

 transition:width .7s ease;
}

/* =========================================================
   STATS
========================================================= */

.grid{
 display:grid;

 gap:11px;
}

.two{
 grid-template-columns:1fr 1fr;
}

.stat{
 min-height:105px;

 position:relative;

 overflow:hidden;

 background:
 linear-gradient(
 145deg,
 #ffffff,
 #f4faff
 );
}

.stat:nth-child(1){
 border-color:#b9dcfa;
}

.stat:nth-child(2){
 border-color:#ffd6a5;
}

.stat:nth-child(3){
 border-color:#c8edc4;
}

.stat:nth-child(4){
 border-color:#d9cdfd;
}

.stat:after{
 content:"";

 position:absolute;

 right:-20px;
 bottom:-25px;

 width:80px;
 height:80px;

 border-radius:50%;
}

.stat:nth-child(1):after{
 background:#2388ff18;
}

.stat:nth-child(2):after{
 background:#ff8a2118;
}

.stat:nth-child(3):after{
 background:#51c94b18;
}

.stat:nth-child(4):after{
 background:#8b6cff18;
}

.stat span{
 display:block;

 color:var(--blue2);

 font-size:9px;

 font-weight:1000;

 letter-spacing:1px;
}

.stat:nth-child(2) span{
 color:#e47a0b;
}

.stat:nth-child(3) span{
 color:#329a2e;
}

.stat:nth-child(4) span{
 color:#7354df;
}

.stat b{
 display:block;

 font-size:26px;

 margin-top:7px;

 color:var(--text);

 font-weight:1000;
}

.stat small{
 color:var(--muted);

 font-size:9px;
}

/* =========================================================
   QUESTS
========================================================= */

.quest{
 width:100%;

 display:flex;

 align-items:center;

 gap:11px;

 padding:13px;

 margin-bottom:11px;

 background:white;

 border:2px solid #cbdfee;

 border-radius:18px;

 text-align:left;

 transition:.15s;

 position:relative;

 overflow:hidden;

 box-shadow:
 0 5px 0 #c5dbea;
}

.quest:before{
 content:"";

 position:absolute;

 left:0;
 top:0;
 bottom:0;

 width:6px;
}

.quest:nth-child(1):before{
 background:linear-gradient(
 180deg,
 var(--orange),
 var(--yellow)
 );
}

.quest:nth-child(2):before{
 background:linear-gradient(
 180deg,
 var(--blue),
 var(--cyan)
 );
}

.quest:nth-child(3):before{
 background:linear-gradient(
 180deg,
 var(--purple),
 var(--pink)
 );
}

.quest:nth-child(4):before{
 background:linear-gradient(
 180deg,
 var(--green),
 var(--cyan)
 );
}

.quest:hover{
 transform:translateY(-3px);

 border-color:var(--blue);

 box-shadow:
 0 8px 0 #b9d7ec;
}

.quest:active{
 transform:translateY(2px);

 box-shadow:
 0 2px 0 #c5dbea;
}

.quest-icon{
 width:48px;
 height:48px;

 flex:none;

 display:grid;

 place-items:center;

 border-radius:14px;

 background:#e7f4ff;

 border:2px solid #bcdcf2;

 color:var(--blue2);

 font-size:18px;
}

.quest:nth-child(2) .quest-icon{
 background:var(--orange3);
 border-color:#ffd4a0;
 color:var(--orange);
}

.quest:nth-child(3) .quest-icon{
 background:var(--purple3);
 border-color:#d4c9ff;
 color:var(--purple);
}

.quest:nth-child(4) .quest-icon{
 background:var(--green3);
 border-color:#bde7b8;
 color:#329a2e;
}

.quest-info{
 flex:1;

 min-width:0;
}

.quest-info b{
 display:block;

 font-size:13px;

 color:var(--text);

 font-weight:1000;
}

.quest-info p{
 margin:4px 0 0;

 color:var(--muted);

 font-size:10px;
}

.reward{
 color:#e18a00;

 font-size:10px;

 font-weight:1000;

 white-space:nowrap;

 background:#fff1d9;

 border-radius:8px;

 padding:6px;
}

/* =========================================================
   MAP
========================================================= */

.world-map{
 padding:17px;

 border-radius:23px;

 background:
 radial-gradient(circle at 20% 0,#ffffff 0,transparent 30%),
 radial-gradient(circle at 90% 80%,#e6f4ff 0,transparent 30%),
 linear-gradient(
 180deg,
 #dff1ff,
 #f4fbff
 );

 border:3px solid #a9d2ef;

 overflow:hidden;

 box-shadow:
 0 7px 0 #b8d6e9;
}

.map-click-area{
 width:100%;

 display:block;

 cursor:pointer;

 border-radius:16px;

 background:none;

 padding:0;

 margin:0;

 text-align:left;
}

.map-click-area:hover .zone{
 transform:translateX(5px);
}

.map-click-area:active .zone{
 transform:scale(.97);
}

.zone{
 position:relative;

 padding:15px 0;

 display:flex;

 align-items:center;

 gap:12px;

 transition:.15s;
}

.zone:not(:last-child):after{
 content:"";

 position:absolute;

 left:26px;

 top:67px;

 width:5px;

 height:36px;

 background:
 repeating-linear-gradient(
 180deg,
 #9ec7e6 0 7px,
 transparent 7px 12px
 );

 border-radius:10px;
}

.zone-node{
 width:56px;
 height:56px;

 flex:none;

 display:grid;

 place-items:center;

 border-radius:18px;

 background:white;

 border:3px solid #a9c9df;

 color:#6e8ba4;

 font-size:19px;

 z-index:2;

 box-shadow:
 0 5px 0 #a9c9dc;
}

.zone:nth-child(1) .zone-node{
 border-color:var(--orange);
 color:var(--orange);
 background:var(--orange3);
}

.zone:nth-child(2) .zone-node{
 border-color:var(--blue);
 color:var(--blue);
 background:var(--blue3);
}

.zone:nth-child(3) .zone-node{
 border-color:var(--green);
 color:#329a2e;
 background:var(--green3);
}

.zone:nth-child(4) .zone-node{
 border-color:var(--purple);
 color:var(--purple);
 background:var(--purple3);
}

.zone:nth-child(5) .zone-node{
 border-color:var(--pink);
 color:var(--pink);
 background:var(--pink3);
}

.zone.unlocked .zone-node{
 box-shadow:
 0 5px 0 #dc7817,
 0 0 0 4px #ffffff99;
}

.zone.python .zone-node{
 border-color:var(--blue);

 background:#e7f5ff;

 color:var(--blue);

 box-shadow:
 0 5px 0 #1970c5;
}

.zone.locked{
 opacity:.55;
}

.zone-info{
 flex:1;
}

.zone-info b{
 display:block;

 font-size:13px;

 color:var(--text);

 font-weight:1000;
}

.zone-info small{
 color:var(--muted);

 font-size:10px;
}

.zone-status{
 font-size:9px;

 font-weight:1000;

 color:var(--lime);

 background:#e8f8e6;

 padding:6px 7px;

 border-radius:8px;
}

.zone.locked .zone-status{
 color:#8194a7;

 background:#e6edf3;
}

/* =========================================================
   BATTLE / QUIZ
========================================================= */

.battle-card{
 padding:18px;

 border-radius:24px;

 background:
 radial-gradient(circle at 50% 0,#ff9a3030,transparent 35%),
 radial-gradient(circle at 0% 100%,#8b6cff18,transparent 35%),
 linear-gradient(
 145deg,
 #ffffff,
 #f5faff
 );

 border:3px solid #bcd7eb;

 box-shadow:
 0 8px 0 #bdd6e7,
 0 18px 35px #4a7fa51c;
}

.enemy{
 text-align:center;

 padding:12px;
}

.enemy-icon{
 font-size:58px;

 color:var(--orange);

 filter:
 drop-shadow(0 5px 0 #d66d15);

 animation:float 2.5s ease-in-out infinite;
}

.enemy-name{
 color:var(--blue2);

 font-weight:1000;

 font-size:13px;

 letter-spacing:1px;
}

.hp{
 height:11px;

 margin:7px auto 15px;

 max-width:230px;

 background:#e6edf2;

 border:2px solid #c5d6e2;

 border-radius:99px;

 overflow:hidden;
}

.hp-fill{
 height:100%;

 background:
 linear-gradient(
 90deg,
 var(--red),
 var(--orange),
 var(--yellow)
 );

 transition:.4s;
}

.choice{
 width:100%;

 padding:14px;

 margin:7px 0;

 background:white;

 border:2px solid #c9dce9;

 border-radius:14px;

 text-align:left;

 font-size:12px;

 font-weight:900;

 transition:.15s;

 box-shadow:
 0 4px 0 #c9dce8;
}

.choice:hover{
 border-color:var(--blue);

 background:#f1f9ff;

 transform:translateY(-2px);
}

.choice.selected{
 border-color:var(--orange);

 background:#fff4e5;

 color:#c86d00;

 box-shadow:
 0 4px 0 #e0a34d;
}

.choice.correct{
 border-color:var(--lime);

 background:#ecfaeb;

 color:#278622;

 box-shadow:
 0 4px 0 #a5d7a0;
}

.choice.wrong{
 border-color:var(--red);

 background:#fff0f0;

 color:#c83e3e;

 box-shadow:
 0 4px 0 #e0a5a5;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
 width:100%;

 padding:14px 15px;

 margin-top:10px;

 border-radius:14px;

 background:#eaf4fc;

 border:2px solid #bfd7e8;

 color:var(--blue2);

 font-weight:1000;

 transition:.15s;

 box-shadow:
 0 5px 0 #bfd3e1;
}

.btn:hover{
 transform:translateY(-2px);

 background:#dff0ff;

 border-color:var(--blue);
}

.btn:active{
 transform:translateY(3px);

 box-shadow:
 0 2px 0 #bfd3e1;
}

.btn.primary{
 background:
 linear-gradient(
 180deg,
 #ffb34d,
 var(--orange)
 );

 color:white;

 border-color:#ef7710;

 box-shadow:
 0 5px 0 #d5640b,
 0 8px 20px #ff8a2130;
}

.btn.primary:hover{
 background:
 linear-gradient(
 180deg,
 #ffc164,
 #ff922a
 );
}

.btn.python{
 background:
 linear-gradient(
 180deg,
 #62bcff,
 var(--blue)
 );

 color:white;

 border-color:#0870d8;

 box-shadow:
 0 5px 0 #075da9;
}

.btn.green{
 background:
 linear-gradient(
 180deg,
 #78dc70,
 var(--lime)
 );

 color:#174c16;

 border-color:#38a634;

 box-shadow:
 0 5px 0 #30902d;
}

.btn.purple{
 background:
 linear-gradient(
 180deg,
 #b09aff,
 var(--purple)
 );

 color:white;

 border-color:#7356dc;

 box-shadow:
 0 5px 0 #6849d0;
}

.btn.pink{
 background:
 linear-gradient(
 180deg,
 #ff91b8,
 var(--pink)
 );

 color:white;

 border-color:#e84f89;

 box-shadow:

<script>

/* =========================================================
ACCOUNT
========================================================= */

const ACCOUNT_KEY="codequest_accounts_v6";
const SESSION_KEY="codequest_session_v6";

function getAccounts(){
 return JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"{}");
}

function saveAccounts(accounts){
 localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts));
}

function currentUser(){
 return localStorage.getItem(SESSION_KEY);
}

function showAuthError(text){
 const el=document.querySelector("#authError");
 if(el)el.textContent=text;
}

/* =========================================================
LOGIN
========================================================= */

function showLogin(){

 document.querySelector("#loginTab").classList.add("active");
 document.querySelector("#registerTab").classList.remove("active");

 document.querySelector("#authForm").innerHTML=`

 <div class="input-group">
 <label>Name</label>
 <input class="input" id="username" placeholder="Your name">
 </div>

 <div class="input-group">
 <label>Password</label>
 <input class="input" id="password" type="password" placeholder="Your password">
 </div>

 <div class="auth-error" id="authError"></div>

 <button class="btn primary" onclick="login()">
 <i class="fa-solid fa-right-to-bracket"></i>
 LOG IN
 </button>

 `;
}

function showRegister(){

 document.querySelector("#loginTab").classList.remove("active");
 document.querySelector("#registerTab").classList.add("active");

 document.querySelector("#authForm").innerHTML=`

 <div class="input-group">
 <label>Name</label>
 <input class="input" id="username" placeholder="Choose your name">
 </div>

 <div class="input-group">
 <label>Password</label>
 <input class="input" id="password" type="password" placeholder="At least 4 characters">
 </div>

 <div class="input-group">
 <label>Repeat Password</label>
 <input class="input" id="confirm" type="password" placeholder="Type it again">
 </div>

 <div class="auth-error" id="authError"></div>

 <button class="btn primary" onclick="register()">
 <i class="fa-solid fa-user-plus"></i>
 CREATE ACCOUNT
 </button>

 `;
}

function register(){

 const username=document.querySelector("#username").value.trim().toLowerCase();
 const password=document.querySelector("#password").value;
 const confirm=document.querySelector("#confirm").value;

 if(username.length<3){
  showAuthError("Name must have at least 3 letters.");
  return;
 }

 if(password.length<4){
  showAuthError("Password must have at least 4 characters.");
  return;
 }

 if(password!==confirm){
  showAuthError("Passwords do not match.");
  return;
 }

 const accounts=getAccounts();

 if(accounts[username]){
  showAuthError("That name is already used.");
  return;
 }

 accounts[username]=createDefaultState();
 accounts[username].password=password;

 saveAccounts(accounts);

 localStorage.setItem(SESSION_KEY,username);

 initApp();

 toast("Account created.");
}

function login(){

 const username=document.querySelector("#username").value.trim().toLowerCase();
 const password=document.querySelector("#password").value;

 const accounts=getAccounts();

 if(!accounts[username]){
  showAuthError("Name not found.");
  return;
 }

 if(accounts[username].password!==password){
  showAuthError("Wrong password.");
  return;
 }

 localStorage.setItem(SESSION_KEY,username);

 initApp();
}

function logout(){

 saveState();

 localStorage.removeItem(SESSION_KEY);

 document.querySelector("#authScreen").style.display="grid";

 showLogin();
}

/* =========================================================
DEFAULT STATE
========================================================= */

function createDefaultState(){

 return{
  password:"",
  created:Date.now(),
  xp:0,
  level:0,
  coins:50,
  streak:0,
  completed:0,
  achievements:["newcoder"],
  lessonXP:{},
  pythonFiles:{
   "welcome.txt":"Welcome to Duolincode Python!\n\nStart learning Python here."
  },
  codeRuns:0,
  pythonRuns:0,
  lastLogin:null
 };

}

/* =========================================================
GAME STATE
========================================================= */

let state=null;
let currentPage="home";
let selected=null;
let quizDone=false;
let quizQuestion=null;
let combo=0;
let activeLanguage="python";

/* =========================================================
SAVE / LOAD
========================================================= */

function saveState(){

 const accounts=getAccounts();
 const user=currentUser();

 if(!user||!state)return;

 accounts[user]=state;

 saveAccounts(accounts);
}

function loadState(){

 const accounts=getAccounts();
 const user=currentUser();

 if(!user||!accounts[user]){
  return false;
 }

 state=accounts[user];

 if(state.xp===undefined)state.xp=0;
 if(state.level===undefined)state.level=0;
 if(state.coins===undefined)state.coins=50;
 if(state.streak===undefined)state.streak=0;
 if(state.completed===undefined)state.completed=0;
 if(!state.achievements)state.achievements=[];
 if(!state.lessonXP)state.lessonXP={};
 if(!state.pythonFiles)state.pythonFiles={};
 if(state.codeRuns===undefined)state.codeRuns=0;
 if(state.pythonRuns===undefined)state.pythonRuns=0;

 updateLoginStreak();

 return true;
}

function initApp(){

 if(!loadState()){
  showLogin();
  return;
 }

 document.querySelector("#authScreen").style.display="none";

 const user=currentUser();

 document.querySelector("#avatar").textContent=
 user.charAt(0).toUpperCase();

 render();
}

/* =========================================================
STREAK
========================================================= */

function updateLoginStreak(){

 const today=new Date().toDateString();

 if(!state.lastLogin){

  state.streak=1;

 }else{

  const last=new Date(state.lastLogin);
  const lastDate=last.toDateString();

  if(today!==lastDate){

   const yesterday=new Date();
   yesterday.setDate(yesterday.getDate()-1);

   if(lastDate===yesterday.toDateString()){
    state.streak++;
   }else{
    state.streak=1;
   }

  }

 }

 state.lastLogin=new Date().toISOString();

 saveState();
}

/* =========================================================
XP
========================================================= */

function addXP(amount,reason="",rerender=true){

 if(!state)return;

 const oldLevel=state.level;

 state.xp+=amount;
 state.coins+=Math.max(1,Math.floor(amount/5));
 state.level=Math.floor(state.xp/100);

 saveState();

 createXPFloat(amount);

 if(state.level>oldLevel){
  showLevelUp(state.level);
 }

 checkAchievements();

 if(rerender){
  render();
 }else{
  headerStats();

/* =========================================================
JAVASCRIPT
========================================================= */

function runJavaScript(code,output){

 try{

  const logs=[];

  const fakeConsole={
   log:(...args)=>logs.push(args.map(String).join(" ")),
   error:(...args)=>logs.push("ERROR: "+args.map(String).join(" ")),
   warn:(...args)=>logs.push("WARNING: "+args.map(String).join(" "))
  };

  new Function("console",code)(fakeConsole);

  state.codeRuns++;

  addXP(5,"Code run",false);

  unlockAchievement("code","First Code");

  output.classList.remove("error");

  output.textContent=
   logs.length
   ? logs.join("\n")
   : "Code ran with no output.";

 }catch(error){

  output.classList.add("error");

  output.textContent=
   "JavaScript Error: "+error.message;
 }
}

/* =========================================================
PYTHON
========================================================= */

let pythonInputState=null;

function runPython(code,output){

 const lines=code.split(/\r?\n/);
 const vars={};
 const logs=[];

 try{

  for(let i=0;i<lines.length;i++){

   let line=lines[i].trim();

   if(!line||line.startsWith("#"))continue;

   if(line.startsWith("print(")&&line.endsWith(")")){

    const inside=line.slice(6,-1);

    const parts=splitPythonArguments(inside);

    const values=parts.map(
     part=>evaluatePythonExpression(part,vars)
    );

    logs.push(values.map(String).join(" "));

    continue;
   }

   const inputAssignment=
    line.match(/^([A-Za-z_]\w*)\s*=\s*input\((.*)\)$/);

   if(inputAssignment){

    const variable=inputAssignment[1];

    const prompt=
     evaluatePythonExpression(
      inputAssignment[2],
      vars
     );

    return waitForPythonInput(
     code,
     output,
     variable,
     prompt,
     vars,
     logs,
     lines,
     i
    );
   }

   const assignment=
    line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);

   if(assignment){

    vars[assignment[1]]=
     evaluatePythonExpression(
      assignment[2],
      vars
     );

    continue;
   }

   throw new Error(
    "I do not know this Python code yet: "+line
   );
  }

  finishPythonExecution(output,logs);

 }catch(error){

  output.classList.add("error");

  output.textContent=
   "Python Error: "+error.message;
 }
}

function waitForPythonInput(
 code,
 output,
 variable,
 prompt,
 vars,
 logs,
 lines,
 inputLine
){

 const consoleBox=document.querySelector("#inputConsole");
 const input=document.querySelector("#pythonInput");

 if(!consoleBox||!input){
  throw new Error("The input box is not available.");
 }

 consoleBox.style.display="block";

 input.placeholder=
  String(prompt||"Type something...");

 input.value="";
 input.focus();

 pythonInputState={
  code,
  output,
  variable,
  vars,
  logs,
  lines,
  inputLine
 };

 output.textContent=
  "Your program is waiting for your answer...";
}

function submitPythonInput(){

 if(!pythonInputState)return;

 const input=document.querySelector("#pythonInput");

 const value=input.value;

 if(value==="")return;

 const data=pythonInputState;

 data.vars[data.variable]=value;

 pythonInputState=null;

 document.querySelector("#inputConsole").style.display="none";

 continuePythonExecution(data);
}

function continuePythonExecution(data){

 const{
  output,
  vars,
  logs,
  lines,
  inputLine
 }=data;

 try{

  for(let i=inputLine+1;i<lines.length;i++){

   let line=lines[i].trim();

   if(!line||line.startsWith("#"))continue;

   if(line.startsWith("print(")&&line.endsWith(")")){

    const inside=line.slice(6,-1);

    const parts=splitPythonArguments(inside);

    const values=parts.map(
     p=>evaluatePythonExpression(p,vars)
    );

    logs.push(values.map(String).join(" "));

    continue;
   }

   const assignment=
    line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);

   if(assignment){

    vars[assignment[1]]=
     evaluatePythonExpression(
      assignment[2],
      vars
     );

    continue;
   }

   throw new Error(
    "I do not know this Python code yet: "+line
   );
  }

  finishPythonExecution(output,logs);

 }catch(error){

  output.classList.add("error");

  output.textContent=
   "Python Error: "+error.message;
 }
}

function finishPythonExecution(output,logs){

 state.pythonRuns++;

 saveState();

 addXP(5,"Python code run",false);

 unlockAchievement(
  "python",
  "Python Coder"
 );

 output.classList.remove("error");

 output.textContent=
  logs.length
  ? logs.join("\n")
  : "Python finished with no output.";
}

/* =========================================================
PYTHON EXPRESSIONS
========================================================= */

function evaluatePythonExpression(expression,vars){

 expression=expression.trim();

 if(
  (expression.startsWith('"')&&expression.endsWith('"'))||
  (expression.startsWith("'")&&expression.endsWith("'"))
 ){

  return expression.slice(1,-1);
 }

 if(Object.prototype.hasOwnProperty.call(vars,expression)){
  return vars[expression];
 }

 if(expression==="True")return true;
 if(expression==="False")return false;
 if(expression==="None")return null;

 const lenMatch=expression.match(/^len\((.+)\)$/);

 if(lenMatch){

  const value=
   evaluatePythonExpression(
    lenMatch[1],
    vars
   );

  return String(value).length;
 }

 if(expression.includes("+")){

  const parts=splitOperator(expression,"+");

  const values=parts.map(
   p=>evaluatePythonExpression(p,vars)
  );

  if(values.every(v=>typeof v==="number")){
   return values.reduce((a,b)=>a+b,0);
  }

  return values.map(String).join("");
 }

 if(expression.includes("-")){

  const parts=splitOperator(expression,"-");

  if(parts.length===2){

   const a=Number(
    evaluatePythonExpression(parts[0],vars)
   );

   const b=Number(
    evaluatePythonExpression(parts[1],vars)
   );

   if(!isNaN(a)&&!isNaN(b)){
    return a-b;
   }
  }
 }

 if(expression.includes("*")){

  const parts=splitOperator(expression,"*");

  if(parts.length===2){

   const a=Number(
    evaluatePythonExpression(parts[0],vars)
   );

   const b=Number(
    evaluatePythonExpression(parts[1],vars)
   );

   if(!isNaN(a)&&!isNaN(b)){
    return a*b;
   }
  }
 }

 if(
  expression!=="" &&
  !isNaN(Number(expression))
 ){

  return Number(expression);
 }

 return expression;
}

function splitPythonArguments(text){

 const result=[];
 let current="";
 let quote=null;

 for(let i=0;i<text.length;i++){

  const char=text[i];

  if(
   (char==="'"||char==='"')&&
   !quote
  ){

   quote=char;
   current+=char;
   continue;
  }

  if(char===quote){

   quote=null;
   current+=char;
   continue;
  }

  if(char===","&&!quote){

   result.push(current.trim());
   current="";
   continue;
  }

  current+=char;
 }

 if(current.trim()){
  result.push(current.trim());
 }

 return result;
}

function splitOperator(text,operator){

 return text
  .split(operator)
  .map(x=>x.trim());
}

function downloadFile(name){

  [content],
  {type:"text/plain"}
 );

 a.click();

 a.remove();

 URL.revokeObjectURL(url);

 toast("File saved.");

/* ========================================================= SAFE TEXT
========================================================= */

function escapeHTML(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

 return String(value)
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'");
}
