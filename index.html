<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#060912">
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050711">
<title>CodeQuest: Learn to Code</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}

:root{
 --bg:#050711;
 --panel:#0d1321;
 --panel2:#121a2b;
 --line:#26344d;
 --text:#f5f7ff;
 --muted:#8190a8;
 --orange:#ff8738;
 --gold:#ffd45c;
 --cyan:#43d9ff;
 --python:#5fc9ff;
 --purple:#a879ff;
 --pink:#ff4d9a;
 --lime:#8bea52;
 --red:#ff536b;
}

html{scroll-behavior:smooth}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(circle at 20% 10%,#14213a 0,transparent 28%),
 radial-gradient(circle at 90% 80%,#24133c 0,transparent 30%),
 #03050a;
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

.app-shell{
 width:100%;
 max-width:560px;
 min-height:100vh;
 margin:auto;
 background:
 linear-gradient(#ffffff03 1px,transparent 1px),
 linear-gradient(90deg,#ffffff03 1px,transparent 1px),
 #070b14;
 background-size:28px 28px;
 position:relative;
 overflow:hidden;
 padding-bottom:90px;
}

/* LOGIN */

#authScreen{
 position:fixed;
 inset:0;
 z-index:1000;
 display:grid;
 place-items:center;
 padding:20px;
 background:radial-gradient(circle at 50% 20%,#172847 0,transparent 35%),#03050a;
}

.auth-box{
 width:min(430px,100%);
 padding:28px;
 background:#0c1220ee;
 border:1px solid #34435e;
 border-radius:25px;
 box-shadow:0 30px 100px #000;
 backdrop-filter:blur(15px);
 animation:pop .5s ease;
}

.logo{text-align:center;margin-bottom:22px}

.logo-mark{
 width:76px;
 height:76px;
 margin:auto;
 display:grid;
 place-items:center;
 border-radius:22px;
 background:linear-gradient(145deg,var(--orange),#ffb45b);
 color:#15100b;
 font-size:27px;
 box-shadow:0 0 25px #ff873855;
 transform:rotate(-4deg);
}

.logo h1{
 margin:15px 0 3px;
 font-size:32px;
}

.logo p{
 margin:0;
 color:var(--muted);
 font-size:13px;
}

.auth-tabs{
 display:flex;
 gap:5px;
 padding:5px;
 background:#060a12;
 border:1px solid var(--line);
 border-radius:13px;
 margin-bottom:18px;
}

.auth-tabs button{
 flex:1;
 padding:11px;
 background:none;
 color:var(--muted);
 border-radius:9px;
 font-weight:900;
}

.auth-tabs button.active{
 background:#202d43;
 color:var(--orange);
}

.input-group{margin-bottom:13px}

.input-group label{
 display:block;
 font-size:9px;
 text-transform:uppercase;
 letter-spacing:1.7px;
 color:var(--muted);
 font-weight:900;
 margin-bottom:6px;
}

.input{
 width:100%;
 padding:13px;
 background:#060a12;
 border:1px solid #30405a;
 border-radius:12px;
 outline:none;
}

.input:focus{
 border-color:var(--orange);
 box-shadow:0 0 0 3px #ff873515;
}

.auth-error{
 min-height:18px;
 color:var(--red);
 font-size:12px;
 margin:4px 0;
}

/* TOP */

.topbar{
 height:68px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 13px;
 border-bottom:1px solid #26334a;
 background:#080d18ef;
 backdrop-filter:blur(14px);
 position:sticky;
 top:0;
 z-index:20;
}

.icon-btn{
 width:40px;
 height:40px;
 border-radius:12px;
 background:#111a2b;
 border:1px solid #2c3c58;
 font-size:16px;
 transition:.2s;
}

.icon-btn:hover{
 border-color:var(--orange);
 box-shadow:0 0 25px #ff873855;
 transform:translateY(-2px);
}

.brand{
 display:flex;
 align-items:center;
 gap:8px;
 font-weight:950;
}

.brand-mark{
 color:var(--orange);
 font-family:monospace;
}

.header-right{
 display:flex;
 align-items:center;
 gap:5px;
}

.resource{
 background:#10192a;
 border:1px solid #2b3a54;
 border-radius:10px;
 padding:7px 8px;
 font-size:10px;
}

.resource:first-child{color:var(--gold)}
.resource:nth-child(2){color:#ff714d}

.avatar{
 width:35px;
 height:35px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,var(--purple),var(--pink));
 color:#130b1c;
 font-weight:950;
 border:2px solid #d5bfff;
}

/* MAIN */

#main{padding:18px 14px 30px}

.hero{
 padding:8px 3px 19px;
 animation:rise .35s ease;
}

.eyebrow{
 font-size:9px;
 color:var(--orange);
 font-weight:950;
 letter-spacing:2px;
 text-transform:uppercase;
}

.hero h1{
 font-size:29px;
 line-height:1.04;
 margin:8px 0;
}

.hero p{
 color:var(--muted);
 font-size:13px;
 line-height:1.55;
 margin:0;
}

/* CARDS */

.card{
 background:linear-gradient(145deg,#101827,#0c1320);
 border:1px solid #283750;
 border-radius:19px;
 padding:15px;
 box-shadow:0 14px 35px #0006;
 animation:rise .35s ease both;
}

.card h2,.card h3{margin:0 0 7px}

.muted{
 color:var(--muted);
 font-size:12px;
 line-height:1.5;
}

.section{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:23px 0 10px;
}

.section h2{
 margin:0;
 font-size:17px;
}

.section button{
 background:none;
 color:var(--orange);
 font-size:10px;
 font-weight:950;
}

/* PLAYER */

.player-card{
 position:relative;
 overflow:hidden;
 padding:17px;
 border-radius:21px;
 background:
 radial-gradient(circle at 90% 0,#ff87381a,transparent 40%),
 linear-gradient(145deg,#111a2c,#0c1321);
 border:1px solid #33435d;
 box-shadow:0 15px 40px #0007;
}

.player-top{
 display:flex;
 align-items:center;
 gap:13px;
}

.player-avatar{
 width:60px;
 height:60px;
 border-radius:18px;
 display:grid;
 place-items:center;
 font-size:25px;
 background:linear-gradient(145deg,#202e48,#111a2b);
 border:2px solid var(--orange);
 box-shadow:0 0 25px #ff873855;
}

.player-info{flex:1}

.player-info small{
 color:var(--muted);
 font-size:9px;
}

.player-info b{
 display:block;
 margin-top:3px;
 font-size:17px;
}

.rank{
 color:var(--gold);
 font-size:10px;
 font-weight:900;
}

.xp-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:14px;
 font-size:10px;
 font-weight:900;
}

.xp-bar{
 height:10px;
 margin:7px 0 4px;
 background:#060a11;
 border:1px solid #29364c;
 border-radius:99px;
 overflow:hidden;
}

.xp-fill{
 height:100%;
 background:linear-gradient(90deg,var(--orange),var(--gold));
 border-radius:99px;
 box-shadow:0 0 12px #ff873888;
 transition:width .7s ease;
}

/* STATS */

.grid{
 display:grid;
 gap:9px;
}

.two{
 grid-template-columns:1fr 1fr;
}

.stat{
 min-height:100px;
 position:relative;
 overflow:hidden;
}

.stat span{
 display:block;
 color:var(--muted);
 font-size:9px;
 font-weight:900;
 letter-spacing:1px;
}

.stat b{
 display:block;
 font-size:25px;
 margin-top:7px;
}

.stat small{
 color:var(--muted);
 font-size:9px;
}

/* TASKS */

.quest{
 width:100%;
 display:flex;
 align-items:center;
 gap:11px;
 padding:13px;
 margin-bottom:9px;
 background:linear-gradient(145deg,#111b2c,#0b121e);
 border:1px solid #2b3b56;
 border-radius:17px;
 text-align:left;
 transition:.2s;
 position:relative;
 overflow:hidden;
}

.quest:before{
 content:"";
 position:absolute;
 left:0;
 top:0;
 bottom:0;
 width:3px;
 background:var(--orange);
}

.quest:hover{
 transform:translateY(-3px);
 border-color:#506685;
}

.quest-icon{
 width:48px;
 height:48px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:14px;
 background:#182238;
 border:1px solid #31435f;
 font-size:17px;
}

.quest-info{
 flex:1;
 min-width:0;
}

.quest-info b{
 display:block;
 font-size:13px;
}

.quest-info p{
 margin:4px 0 0;
 color:var(--muted);
 font-size:10px;
}

.reward{
 color:var(--gold);
 font-size:10px;
 font-weight:950;
 white-space:nowrap;
}

/* MAP */

.world-map{
 padding:17px;
 border-radius:21px;
 background:
 radial-gradient(circle at 50% 0,#25476b22,transparent 35%),
 linear-gradient(180deg,#0d1727,#080d17);
 border:1px solid #2c3e5b;
 overflow:hidden;
}

.map-click-area{
 width:100%;
 display:block;
 cursor:pointer;
 border-radius:16px;
 background:none;
 padding:0;
 margin:0;
 text-align:left;
}

.map-click-area:hover .zone{
 transform:translateX(4px);
 border-color:#506685;
}

.map-click-area:active .zone{
 transform:scale(.98);
}

.zone{
 position:relative;
 padding:15px 0;
 display:flex;
 align-items:center;
 gap:12px;
 transition:.2s;
}

.zone:not(:last-child):after{
 content:"";
 position:absolute;
 left:26px;
 top:67px;
 width:3px;
 height:35px;
 background:linear-gradient(var(--orange),#26364e);
}

.zone-node{
 width:54px;
 height:54px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:17px;
 background:#111b2d;
 border:2px solid #33445f;
 font-size:18px;
 z-index:2;
}

.zone.unlocked .zone-node{
 border-color:var(--orange);
 box-shadow:0 0 25px #ff873855;
 background:#211b18;
}

.zone.python .zone-node{
 border-color:var(--python);
 box-shadow:0 0 25px #43d9ff44;
}

.zone.locked{
 opacity:.4;
}

.zone-info{
 flex:1;
}

.zone-info b{
 display:block;
 font-size:13px;
}

.zone-info small{
 color:var(--muted);
 font-size:10px;
}

.zone-status{
 font-size:9px;
 font-weight:900;
 color:var(--lime);
}

.zone.locked .zone-status{
 color:var(--muted);
}

/* BATTLE */

.battle-card{
 padding:18px;
 border-radius:22px;
 background:
 radial-gradient(circle at 50% 0,#ff4d9a18,transparent 40%),
 linear-gradient(145deg,#171226,#0d101e);
 border:1px solid #4a3d64;
 box-shadow:0 20px 50px #0008;
}

.enemy{
 text-align:center;
 padding:12px;
}

.enemy-icon{
 font-size:55px;
 color:var(--pink);
 animation:float 2.5s ease-in-out infinite;
}

.enemy-name{
 color:var(--pink);
 font-weight:950;
 font-size:13px;
}

.hp{
 height:9px;
 margin:7px auto 15px;
 max-width:230px;
 background:#080a10;
 border:1px solid #39233a;
 border-radius:99px;
 overflow:hidden;
}

.hp-fill{
 height:100%;
 background:linear-gradient(90deg,var(--red),var(--pink));
 transition:.4s;
}

.choice{
 width:100%;
 padding:13px;
 margin:7px 0;
 background:#0c1421;
 border:2px solid #293a54;
 border-radius:13px;
 text-align:left;
 font-size:12px;
 font-weight:800;
 transition:.15s;
}

.choice:hover{
 border-color:#536b8d;
 transform:translateX(2px);
}

.choice.selected{
 border-color:var(--orange);
 background:#241910;
}

.choice.correct{
 border-color:var(--lime);
 background:#172616;
}

.choice.wrong{
 border-color:var(--red);
 background:#27141a;
}

/* BUTTONS */

.btn{
 width:100%;
 padding:13px 15px;
 margin-top:10px;
 border-radius:12px;
 background:#172235;
 border:1px solid #344965;
 font-weight:950;
 transition:.18s;
}

.btn:hover{
 transform:translateY(-2px);
}

.btn:active{
 transform:scale(.97);
}

.btn.primary{
 background:linear-gradient(135deg,var(--orange),#ffad54);
 color:#160d06;
 border-color:var(--orange);
}

.btn.python{
 background:linear-gradient(135deg,#42c9ff,#79e1ff);
 color:#061018;
 border-color:var(--cyan);
}

.btn.green{
 background:var(--lime);
 color:#0b1507;
}

/* CODE */

.language-tabs{
 display:flex;
 gap:5px;
 padding:5px;
 background:#060a11;
 border:1px solid #29384f;
 border-radius:13px;
 margin-bottom:12px;
}

.language-tabs button{
 flex:1;
 padding:10px;
 border-radius:9px;
 background:none;
 color:var(--muted);
 font-weight:900;
}

.language-tabs button.active{
 background:#1c2940;
 color:var(--orange);
}

.language-tabs button.python-active{
 color:var(--python);
}

.editor{
 background:#05080d;
 border:1px solid #30405a;
 border-radius:15px;
 overflow:hidden;
}

.editor-top{
 display:flex;
 justify-content:space-between;
 padding:9px 12px;
 border-bottom:1px solid #26344a;
 color:var(--muted);
 font-size:10px;
}

.editor textarea{
 width:100%;
 min-height:250px;
 resize:vertical;
 border:0;
 outline:0;
 background:#05080d;
 color:#dce5ef;
 padding:14px;
 font:13px/1.65 "Courier New",monospace;
}

.output{
 min-height:90px;
 margin-top:9px;
 padding:12px;
 border-radius:11px;
 background:#03060b;
 border:1px solid #293950;
 color:var(--lime);
 font:12px/1.6 monospace;
 white-space:pre-wrap;
 overflow:auto;
}

.output.error{
 color:var(--red);
}

.output-title{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:9px;
 margin-top:12px;
 margin-bottom:5px;
 text-transform:uppercase;
 letter-spacing:1px;
}

/* FILES */

.file-list{
 display:grid;
 gap:8px;
}

.file-item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 background:#0c1421;
 border:1px solid #293a54;
 border-radius:12px;
}

.file-name{
 flex:1;
 font-family:monospace;
 font-size:12px;
}

.file-actions{
 display:flex;
 gap:5px;
}

.file-actions button{
 padding:7px 8px;
 border-radius:8px;
 background:#19263a;
 font-size:10px;
}

/* DRAWER */

#drawer{
 position:fixed;
 z-index:40;
 top:0;
 bottom:0;
 left:max(calc(50% - 280px),0px);
 width:min(305px,84vw);
 padding:24px 14px;
 background:#090f1bf5;
 border-right:1px solid #2c3d57;
 transform:translateX(-105%);
 transition:.3s;
 box-shadow:20px 0 60px #000b;
 backdrop-filter:blur(18px);
}

.drawer-open #drawer{
 transform:translateX(0);
}

#overlay{
 position:fixed;
 inset:0;
 background:#000b;
 z-index:30;
 opacity:0;
 pointer-events:none;
 transition:.3s;
}

.drawer-open #overlay{
 opacity:1;
 pointer-events:auto;
}

.drawer-title{
 color:var(--orange);
 font-size:10px;
 letter-spacing:2px;
 font-weight:950;
 margin:10px 12px 17px;
}

.drawer-item{
 width:100%;
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px 12px;
 margin-bottom:4px;
 background:none;
 border-radius:11px;
 color:#aab6c8;
 text-align:left;
}

.drawer-item:hover{
 background:#172238;
 color:white;
}

.drawer-item.active{
 background:#211a16;
 color:var(--orange);
 border-left:2px solid var(--orange);
}

/* BOTTOM */

.bottom-nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:560px;
 height:82px;
 display:flex;
 background:#080d17f2;
 border-top:1px solid #2b3b55;
 z-index:25;
 backdrop-filter:blur(15px);
}

.bottom-nav button{
 flex:1;
 background:none;
 color:#66758d;
 font-size:17px;
}

.bottom-nav button.active{
 color:var(--orange);
}

.bottom-nav small{
 display:block;
 font-size:9px;
 margin-top:4px;
}

/* TOAST */

#toast{
 position:fixed;
 left:50%;
 bottom:98px;
 transform:translate(-50%,20px);
 z-index:300;
 opacity:0;
 pointer-events:none;
 background:#f5f7fb;
 color:#09101a;
 border-radius:12px;
 padding:11px 15px;
 font-size:12px;
 font-weight:950;
 transition:.25s;
 white-space:nowrap;
}

#toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

/* LEVEL */

#levelup{
 position:fixed;
 inset:0;
 z-index:200;
 display:none;
 place-items:center;
 background:#03050bd9;
 backdrop-filter:blur(8px);
 padding:20px;
}

.levelup-box{
 width:min(350px,100%);
 padding:30px;
 border-radius:25px;
 text-align:center;
 background:#101827;
 border:1px solid #596b87;
 box-shadow:0 30px 100px #000b;
}

.levelup-icon{
 font-size:55px;
 color:var(--gold);
}

.levelup-box h1{
 color:var(--gold);
 font-size:38px;
 margin:8px 0;
}

/* TAGS */

.tag{
 display:inline-block;
 padding:6px 9px;
 border-radius:8px;
 font-size:9px;
 font-weight:950;
 background:#202d43;
 color:var(--muted);
 margin:3px;
}

.tag.python{
 background:#102a37;
 color:var(--python);
 border:1px solid #24536a;
}

/* LESSON */

.lesson-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:12px;
}

.back{
 background:none;
 color:var(--orange);
 font-size:12px;
 font-weight:900;
}

.lesson-number{
 color:var(--muted);
 font-size:9px;
 font-weight:900;
}

.concept{
 background:linear-gradient(145deg,#101827,#0c1320);
 border:1px solid #283750;
 border-radius:19px;
 padding:18px;
 margin-bottom:12px;
}

.concept h1{
 margin:8px 0;
 font-size:25px;
}

.code{
 white-space:pre-wrap;
 background:#05080d;
 border:1px solid #30405a;
 border-radius:12px;
 padding:13px;
 color:#dce5ef;
 font:12px/1.6 "Courier New",monospace;
 margin-top:12px;
 overflow:auto;
}

.file-preview{
 white-space:pre-wrap;
 min-height:150px;
 background:#05080d;
 border:1px solid #30405a;
 border-radius:12px;
 padding:14px;
 margin-top:12px;
 color:#dce5ef;
 font:12px/1.6 monospace;
}

/* ACHIEVEMENTS */

.achievement{
 display:flex;
 align-items:center;
 gap:12px;
 margin-bottom:9px;
}

.achievement .badge{
 width:48px;
 height:48px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:14px;
 background:#182238;
 color:var(--gold);
 font-size:19px;
}

.achievement.locked{
 opacity:.4;
}

.achievement p{
 margin:4px 0 0;
}

/* ANIMATIONS */

@keyframes rise{
 from{
  opacity:0;
  transform:translateY(12px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

@keyframes pop{
 from{
  opacity:0;
  transform:scale(.85);
 }
 to{
  opacity:1;
  transform:scale(1);
 }
}

@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-8px)}
}

@media(min-width:561px){
 body{padding:20px 0}

 .app-shell{
  border-radius:25px;
  box-shadow:0 30px 100px #000c;
 }

 .bottom-nav{
  bottom:20px;
  border-radius:0 0 25px 25px;
 }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="authScreen">
<div class="auth-box">

<div class="logo">
<div class="logo-mark">
<i class="fa-solid fa-code"></i>
</div>

<h1>CODEQUEST</h1>
<p>Learn coding one step at a time.</p>
</div>

<div class="auth-tabs">
<button id="loginTab" class="active">LOG IN</button>
<button id="registerTab">SIGN UP</button>
</div>

<div id="authForm"></div>

</div>
</div>

<!-- LEVEL UP -->

<div id="levelup">
<div class="levelup-box">

<div class="levelup-icon">
<i class="fa-solid fa-trophy"></i>
</div>

<h1>LEVEL UP!</h1>

<p id="levelupText">
You reached a new level.
</p>

<button class="btn primary" onclick="closeLevelUp()">
<i class="fa-solid fa-arrow-right"></i>
KEEP GOING
</button>

</div>
</div>

<!-- APP -->

<div class="app-shell">

<header class="topbar">

<button class="icon-btn" id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

/* =========================================================

========================================================= */

const ACCOUNT_KEY="codequest_accounts_v6";
const SESSION_KEY="codequest_session_v6";

function getAccounts(){
 return JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"{}");
}

function saveAccounts(accounts){
 localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts));
}

function currentUser(){
 return localStorage.getItem(SESSION_KEY);

function showAuthError(text){
 const el=document.querySelector("#authError");
 if(el)el.textContent=text;

function showLogin(){

function showRegister(){

 document.querySelector("#loginTab").classList.remove("active");
 document.querySelector("#registerTab").classList.add("active");

 document.querySelector("#authForm").innerHTML=`

 <div class="input-group">
 <label>Name</label>
 <input class="input" id="username" placeholder="Choose your name">
 </div>

 <div class="input-group">
 <label>Password</label>
 <input class="input" id="password" type="password" placeholder="At least 4 characters">
 </div>

 <div class="input-group">
 <label>Repeat Password</label>
 <input class="input" id="confirm" type="password" placeholder="Type it again">
 </div>

 <div class="auth-error" id="authError"></div>

 <button class="btn primary" onclick="register()">
 <i class="fa-solid fa-user-plus"></i>
 CREATE ACCOUNT
 </button>

 `;
}

function register(){

 const username=document.querySelector("#username").value.trim().toLowerCase();
 const password=document.querySelector("#password").value;
 const confirm=document.querySelector("#confirm").value;

 if(username.length<3){
  showAuthError("Name must have at least 3 letters.");
  return;
 }

 if(password.length<4){
  showAuthError("Password must have at least 4 characters.");
  return;
 }

 if(password!==confirm){
  showAuthError("Passwords do not match.");
  return;
 }

 const accounts=getAccounts();

 if(accounts[username]){
  showAuthError("That name is already used.");
  return;
 }

 accounts[username]=createDefaultState();
 accounts[username].password=password;

 saveAccounts(accounts);

 localStorage.setItem(SESSION_KEY,username);

 initApp();

 toast("Account created.");
}

function login(){

 const username=document.querySelector("#username").value.trim().toLowerCase();
 const password=document.querySelector("#password").value;

 const accounts=getAccounts();

 if(!accounts[username]){
  showAuthError("Name not found.");
  return;
 }

 if(accounts[username].password!==password){
  showAuthError("Wrong password.");
  return;
 }

 localStorage.setItem(SESSION_KEY,username);

 initApp();
}

function logout(){

 saveState();

 localStorage.removeItem(SESSION_KEY);

 document.querySelector("#authScreen").style.display="grid";

 showLogin();
}

function createDefaultState(){

  completed:0,

GAME STATE
========================================================= */

/* =========================================================
SAVE / LOAD
========================================================= */

function saveState(){

 const accounts=getAccounts();
 const user=currentUser();

 if(!user||!state)return;

 accounts[user]=state;

 saveAccounts(accounts);
}

function loadState(){

 const accounts=getAccounts();
 const user=currentUser();

 if(!user||!accounts[user]){
  return false;
 }

 state=accounts[user];

 if(state.xp===undefined)state.xp=0;
 if(state.level===undefined)state.level=0;
 if(state.coins===undefined)state.coins=50;
 if(state.streak===undefined)state.streak=0;
 if(state.completed===undefined)state.completed=0;
 if(!state.achievements)state.achievements=[];
 if(!state.lessonXP)state.lessonXP={};
 if(!state.pythonFiles)state.pythonFiles={};
 if(state.codeRuns===undefined)state.codeRuns=0;
 if(state.pythonRuns===undefined)state.pythonRuns=0;

 updateLoginStreak();

 return true;
}

function initApp(){

 if(!loadState()){
  showLogin();
  return;
 }

 document.querySelector("#authScreen").style.display="none";

 const user=currentUser();

 document.querySelector("#avatar").textContent=
 user.charAt(0).toUpperCase();

 render();
}

/* =========================================================
STREAK
========================================================= */

function updateLoginStreak(){

 const today=new Date().toDateString();

 if(!state.lastLogin){

  state.streak=1;

 }else{

  const last=new Date(state.lastLogin);
  const lastDate=last.toDateString();

  if(today!==lastDate){

   const yesterday=new Date();
   yesterday.setDate(yesterday.getDate()-1);

   if(lastDate===yesterday.toDateString()){
    state.streak++;
   }else{
    state.streak=1;
   }

  }

 }

 state.lastLogin=new Date().toISOString();

 saveState();
}

/* =========================================================
XP
========================================================= */

function addXP(amount,reason="",rerender=true){

 if(!state)return;

 const oldLevel=state.level;

 state.xp+=amount;
 state.coins+=Math.max(1,Math.floor(amount/5));
 state.level=Math.floor(state.xp/100);

 saveState();

 createXPFloat(amount);

 if(state.level>oldLevel){
  showLevelUp(state.level);
 }

 checkAchievements();

 if(rerender){
  render();
 }else{
  headerStats();
 }
}

function createXPFloat(amount){

 const el=document.createElement("div");

 el.style.position="fixed";
 el.style.left="50%";
 el.style.top="48%";
 el.style.zIndex="300";
 el.style.color="var(--gold)";
 el.style.fontSize="25px";
 el.style.fontWeight="950";
 el.style.pointerEvents="none";

 el.textContent="+"+amount+" XP";

 document.body.appendChild(el);

 el.animate([
  {
   opacity:0,
   transform:"translate(-50%,20px) scale(.7)"
  },
  {
   opacity:1,
   transform:"translate(-50%,0) scale(1.1)"
  },
  {
   opacity:0,
   transform:"translate(-50%,-100px)"
  }
 ],{
  duration:1000,
  easing:"ease"
 });

 setTimeout(()=>el.remove(),1000);
}

function showLevelUp(level){

 document.querySelector("#levelupText").textContent=
 "You reached Level "+level+".";

 document.querySelector("#levelup").style.display="grid";
}

function closeLevelUp(){

 document.querySelector("#levelup").style.display="none";

 toast("Level "+state.level+" reached.");

 render();
}

 const el=document.querySelector("#toast");

 el.textContent=text;
 el.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  el.classList.remove("show");
 },1900);

function runJavaScript(code,output){

  const fakeConsole={
   log:(...args)=>logs.push(args.map(String).join(" ")),
   error:(...args)=>logs.push("ERROR: "+args.map(String).join(" ")),

/* =========================================================
PYTHON
========================================================= */

let pythonInputState=null;

function runPython(code,output){

 const lines=code.split(/\r?\n/);
 const vars={};
 const logs=[];

 try{

  for(let i=0;i<lines.length;i++){

   let line=lines[i].trim();

   if(!line||line.startsWith("#"))continue;

   if(line.startsWith("print(")&&line.endsWith(")")){

    const inside=line.slice(6,-1);

    const parts=splitPythonArguments(inside);

    const values=parts.map(
     part=>evaluatePythonExpression(part,vars)
    );

    logs.push(values.map(String).join(" "));

    continue;
   }

   const inputAssignment=
    line.match(/^([A-Za-z_]\w*)\s*=\s*input\((.*)\)$/);

   if(inputAssignment){

    const variable=inputAssignment[1];

    const prompt=
     evaluatePythonExpression(
      inputAssignment[2],
      vars
     );

    return waitForPythonInput(
     code,
     output,
     variable,
     prompt,
     vars,
     logs,
     lines,
     i
    );
   }

   const assignment=
    line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);

   if(assignment){

    vars[assignment[1]]=
     evaluatePythonExpression(
      assignment[2],
      vars
     );

    continue;
   }

   throw new Error(
    "I do not know this Python code yet: "+line
   );
  }

  finishPythonExecution(output,logs);

 }catch(error){

  output.classList.add("error");

  output.textContent=
   "Python Error: "+error.message;
 }
}

function waitForPythonInput(
 code,
 output,
 variable,
 prompt,
 vars,
 logs,
 lines,
 inputLine
){

 const consoleBox=document.querySelector("#inputConsole");
 const input=document.querySelector("#pythonInput");

 if(!consoleBox||!input){
  throw new Error("The input box is not available.");
 }

 consoleBox.style.display="block";

 input.placeholder=
  String(prompt||"Type something...");

 input.value="";
 input.focus();

 pythonInputState={
  code,
  output,
  variable,
  vars,
  logs,
  lines,
  inputLine
 };

 output.textContent=
  "Your program is waiting for your answer...";
}

function submitPythonInput(){

 if(!pythonInputState)return;

 const input=document.querySelector("#pythonInput");

 const value=input.value;

 if(value==="")return;

 const data=pythonInputState;

 data.vars[data.variable]=value;

 pythonInputState=null;

 document.querySelector("#inputConsole").style.display="none";

 continuePythonExecution(data);
}

function continuePythonExecution(data){

 const{
  output,
  vars,
  logs,
  lines,
  inputLine
 }=data;

 try{

  for(let i=inputLine+1;i<lines.length;i++){

   let line=lines[i].trim();

   if(!line||line.startsWith("#"))continue;

   if(line.startsWith("print(")&&line.endsWith(")")){

    const inside=line.slice(6,-1);

    const parts=splitPythonArguments(inside);

    const values=parts.map(
     p=>evaluatePythonExpression(p,vars)
    );

    logs.push(values.map(String).join(" "));

    continue;
   }

   const assignment=
    line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);

   if(assignment){

    vars[assignment[1]]=
     evaluatePythonExpression(
      assignment[2],
      vars
     );

    continue;
   }

   throw new Error(
    "I do not know this Python code yet: "+line
   );
  }

  finishPythonExecution(output,logs);

 }catch(error){

  output.classList.add("error");

  output.textContent=
   "Python Error: "+error.message;
 }
}

function finishPythonExecution(output,logs){

 state.pythonRuns++;

 saveState();

 addXP(5,"Python code run",false);

 unlockAchievement(
  "python",
  "Python Coder"
 );

 output.classList.remove("error");

 output.textContent=
  logs.length
  ? logs.join("\n")
  : "Python finished with no output.";
}

/* =========================================================
PYTHON EXPRESSIONS
========================================================= */

function evaluatePythonExpression(expression,vars){

 expression=expression.trim();

 if(
  (expression.startsWith('"')&&expression.endsWith('"'))||
  (expression.startsWith("'")&&expression.endsWith("'"))
 ){

  return expression.slice(1,-1);
 }

 if(Object.prototype.hasOwnProperty.call(vars,expression)){
  return vars[expression];
 }

 if(expression==="True")return true;
 if(expression==="False")return false;
 if(expression==="None")return null;

 const lenMatch=expression.match(/^len\((.+)\)$/);

 if(lenMatch){

  const value=
   evaluatePythonExpression(
    lenMatch[1],
    vars
   );

  return String(value).length;
 }

 if(expression.includes("+")){

  const parts=splitOperator(expression,"+");

  const values=parts.map(
   p=>evaluatePythonExpression(p,vars)
  );

  if(values.every(v=>typeof v==="number")){
   return values.reduce((a,b)=>a+b,0);
  }

  return values.map(String).join("");
 }

 if(expression.includes("-")){

  const parts=splitOperator(expression,"-");

  if(parts.length===2){

   const a=Number(
    evaluatePythonExpression(parts[0],vars)
   );

   const b=Number(
    evaluatePythonExpression(parts[1],vars)
   );

   if(!isNaN(a)&&!isNaN(b)){
    return a-b;
   }
  }
 }

 if(expression.includes("*")){

  const parts=splitOperator(expression,"*");

  if(parts.length===2){

   const a=Number(
    evaluatePythonExpression(parts[0],vars)
   );

   const b=Number(
    evaluatePythonExpression(parts[1],vars)
   );

   if(!isNaN(a)&&!isNaN(b)){
    return a*b;
   }
  }
 }

 if(
  expression!=="" &&
  !isNaN(Number(expression))
 ){

  return Number(expression);
 }

 return expression;
}

function splitPythonArguments(text){

 const result=[];
 let current="";
 let quote=null;

 for(let i=0;i<text.length;i++){

  const char=text[i];

  if(
   (char==="'"||char==='"')&&
   !quote
  ){

   quote=char;
   current+=char;
   continue;
  }

  if(char===quote){

   quote=null;
   current+=char;
   continue;
  }

  if(char===","&&!quote){

   result.push(current.trim());
   current="";
   continue;
  }

  current+=char;
 }

 if(current.trim()){
  result.push(current.trim());
 }

 return result;
}

function splitOperator(text,operator){

 return text
  .split(operator)
  .map(x=>x.trim());
}

  [content],
  {type:"text/plain"}
 );

 a.click();

 a.remove();

 URL.revokeObjectURL(url);

 toast("File saved.");

 <button class="btn python"
 onclick="go('python')">
 KEEP LEARNING PYTHON
 </button>

 </div>

 <div class="section">
 <h2>Next Level</h2>
 </div>

 <div class="card">

 <h2>${getRank()}</h2>

 <div class="xp-bar">

 <div class="xp-fill"
 style="width:${pct}%">
 </div>

 </div>

 <p class="muted">
 Keep learning to reach the next level.
 </p>

 </div>

 `;
}

function getRank(){

 if(state.level>=10)return"CODE LEGEND";
 if(state.level>=7)return"MASTER CODER";
 if(state.level>=5)return"CODE KNIGHT";
 if(state.level>=3)return"PYTHON CODER";
 if(state.level>=1)return"JUNIOR CODER";

 return"NEW CODER";
}

function hasAchievement(id){

 return state.achievements.includes(id);
}

function achievement(icon,title,desc,unlocked){

 return`

 <div class="card achievement ${unlocked?"":"locked"}">

 <div class="badge">
 <i class="${icon}"></i>
 </div>

 <div>

 <b>${title}</b>

 <p class="muted">
 ${desc}
 </p>

 </div>

 <span style="margin-left:auto">

 ${
  unlocked
  ? '<i class="fa-solid fa-check"></i>'
  : '<i class="fa-solid fa-lock"></i>'
 }

 </span>

 </div>

 `;
}

function unlockAchievement(id,title){

 if(state.achievements.includes(id))return;

 state.achievements.push(id);

 saveState();

 toast("BADGE: "+title);
}

function checkAchievements(){

 if(state.level>=1){
  unlockAchievement("level1","Level One");
 }

 if(state.level>=5){
  unlockAchievement("explorer","Code Knight");
 }

 if(state.level>=10){
  unlockAchievement("legend","Code Legend");
 }
}

/* ========================================================= SAFE TEXT
========================================================= */

function escapeHTML(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

 return String(value)
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'");
}
